name: Bygg om sökindexet

on:
  schedule:
    - cron: "17 2 * * *"  
  workflow_dispatch:

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Väck servern och bygg om sökindexet
        run: |
            curl --silent --show-error --fail-with-body --retry 3 --retry-delay 30 --max-time 180 \
            -X POST https://reloved.onrender.com/api/cron/reindex \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
